[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "gwmock"
authors = [{ name = "Isaac C. F. Wong", email = "chunfung.wong@kuleuven.be" }]
description = "A Python package for simulating gravitational wave detector data for mock data challenges."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Astronomy",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
  "gwmock-signal>=0.13.0", # 0.13.0 is the first release carrying the continuous-wave simulator
  "gwmock-noise>=0.10.0",
  "gwmock-pop>=0.11.4",
  "typer>=0.19.0",         # Literal-type CLI options; the SPEC 0 floor (0.13) predates them
  "tqdm>=4.67.0",
  "h5py>=3.12.1",
  "pydantic>=2.9.0",
  "pymap3d>=3.2.0",
  "psutil>=6.1.0",
  "filelock>=3.16.0",
  "textual>=2.0.0",        # Content.from_markup; the SPEC 0 floor (0.73) predates it
]

[project.optional-dependencies]
sgwb = ["gwmock-signal[sgwb]>=0.13.0"]
# The batched signal path. Without this extra `SignalAdapter.simulate_segments` and
# `execution: batched` raise, because gwmock-signal's batched entry points need JAX and ripple,
# which the base install omits.
#
# **This is CPU JAX.** The wheels resolved here carry no GPU backend, so `execution: batched`
# installed this way batches the work and runs it on the CPU. That is a supported configuration --
# it is the one the test suite exercises -- but it is not device execution, and nothing at runtime
# distinguishes the two beyond `jax.devices()`. Use the `cuda` extra below for a GPU.
jax = ["gwmock-signal[jax]>=0.13.0"]
# The same path with an actual GPU backend. Linux x86_64 with a CUDA 12 driver only; there is no
# macOS or Windows wheel, which is why this is separate from `jax` rather than folded into it.
cuda = ["gwmock-signal[jax]>=0.13.0", "jax[cuda12]>=0.11.0"]

[dependency-groups]
dev = [
  # Declared here only so the `[tool.uv.sources]` pin below applies to it. uv honours a source
  # for a package the project *declares*; ripplegw reaches gwmock transitively through
  # `gwmock-signal[jax]`, and a source alone did not redirect it -- the lock resolved
  # ripplegw 0.3.0 from the registry until this line existed. A dev group keeps it out of the
  # published wheel, where a git dependency must never appear. Remove together with the pin.
  "ripplegw>=0.3",
  "prek>=0.4.11",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-github-actions-annotate-failures>=0.4.2",
]
docs = ["zensical>=0.0.52", "mkdocstrings-python>=2.0.5"]
build = ["hatch>=1.17.1"]
release = ["git-cliff>=2.13.1"]

[project.scripts]
gwmock = "gwmock.cli.main:app"

[project.urls]
Documentation = "https://leuven-gravity-institute.github.io/gwmock"
Source = "https://github.com/Leuven-Gravity-Institute/gwmock"
Tracker = "https://github.com/Leuven-Gravity-Institute/gwmock/issues"

[tool.dependency-support-policy]
policy = "spec0"
groups = ["project", "optional"]
# ecosystem siblings: Renovate keeps them at latest
exclude = ["gwmock-signal", "gwmock-noise", "gwmock-pop"]
lock = "minimal"

[tool.uv-dynamic-versioning]
vcs = "git"      # default
style = "semver" # or pep440, semver, etc.

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/gwmock"]

# Register the custom build hook
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",                # Include the source code
  "/examples/**/*.yaml", # Include only YAML files from examples
  "/tests",              # Include tests for source distributions
  "/README.md",
  "/pyproject.toml",
  "/hatch_build.py",     # Include the build hook itself
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 0

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
addopts = [
  "--cov=gwmock",
  "--cov-report=xml",
  "--cov-report=term",
  "--junitxml=test-results.xml",
  "--cov-append",
  "-m",
  "not integration and not e2e",
]
pythonpath = ["src"]
testpaths = "tests"
junit_family = "xunit2"
markers = [
  "integration: marks as integration test",
  "notebooks: marks as notebook test",
  "gpu: marks as gpu test",
  "spark: marks tests which need Spark",
  "slow: marks tests as slow",
  "unit: fast offline tests",
  # Drives an example configuration through the real CLI. Excluded from the default run via
  # `-m "not e2e"` below, because these generate data and are minutes rather than seconds; the
  # `e2e` CI job runs them, and it installs the extras the matrix needs so the optional-stack
  # entries in tests/e2e/matrix.py actually execute rather than silently skipping.
  "e2e: end-to-end tests that run an example config through the CLI",
]

[tool.ruff]
line-length = 120 # Matches Black's default
target-version = "py312" # Align with requires-python (>=3.12)
lint.select = [
  "E",
  "F",
  "W",   # pycodestyle errors and warnings
  "I",   # isort rules
  "UP",  # pyupgrade rules
  "C90", # McCabe complexity
  "N",   # PEP8 naming
  "B",   # Bugbear (opinionated checks)
  "A",   # Flake8-builtins
  "C4",  # Flake8-comprehensions
  "PT",  # Flake8-pytest
  "RUF", # Ruff-specific rules
  "PL",  # Add pylint rules for fuller coverage
  "SIM", # Similarities
  "T10", # Debugger statements
  "S",   # Security rules
]
lint.ignore = [
  "E501", # Line length (handled by formatter)
  "C901", # Disable overly strict complexity checks (optional, adjust as needed)
]
lint.pylint.max-args = 10
fix = true # Enable autofix
lint.unfixable = [] # List rules that should not be autofixed, if any
exclude = ["docs/conf.py"]

[tool.ruff.format]
quote-style = "double"       # Use double quotes for strings
indent-style = "space"       # Use spaces for indentation
docstring-code-format = true # Format code in docstrings

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules in the tests directory
"tests/*" = ["S101", "ARG001", "PLC0415", "PLR2004"]
# S101: allow assert statements
# ARG001: allow unused function arguments (common in fixtures)
# PLC0415: allow import statements not at the top level
# PLR2004: allow magic values in the unit tests

# TEMPORARY development pin. Remove when a ripplegw release carries the geocentre fix
# (GW-JAX-Team/ripple#141), then raise the floor in the `jax` extra to that version.
#
# Development-only: `[tool.uv.sources]` is not carried into the published wheel, so nobody
# installing gwmock from PyPI inherits a git dependency. Build with `uv build --no-sources` while
# this is present.
#
# Why it moved here. Until gwmock-signal 0.13.0 this file pinned *gwmock-signal* to a git
# revision, and that was enough on its own: gwmock-signal carries its own sources pin of ripplegw,
# and uv honours a git dependency's sources. Consuming the release instead breaks that inheritance
# -- a wheel does not carry `[tool.uv.sources]` -- so resolving `gwmock-signal[jax]>=0.13.0` from
# PyPI produces ripplegw 0.3.0, the version without the fix. Measured, not assumed: a scratch
# project depending only on `gwmock-signal[jax]>=0.13.0` locks `ripplegw 0.3.0` from the registry.
#
# What that costs without this pin. The continuous-wave simulator generates polarizations at the
# geocentre so one projection route serves every source type; released ripplegw evaluates the
# detector latitude as `arccos(lz / rd)`, which is 0/0 there, and returns NaN for every sample.
# gwmock-signal 0.13.0 refuses that rather than writing it, so the failure is loud -- but
# continuous waves would simply not work in this repository's own development and CI.
[tool.uv.sources]
ripplegw = { git = "https://github.com/GW-JAX-Team/ripple.git", rev = "400afb4" }

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
