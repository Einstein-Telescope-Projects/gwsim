[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "gwmock"
authors = [{ name = "Isaac C. F. Wong", email = "chunfung.wong@kuleuven.be" }]
description = "A Python package for simulating gravitational wave detector data for mock data challenges."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Astronomy",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
  # Two floors, both behavioural rather than conveniences.
  #
  # 0.15.0 first exposed `CBCSimulator.pre_coalescence_duration`, which segment placement asks
  # before generating so an event is claimed by the segment its *waveform* starts in rather than the
  # one holding its coalescence. Below it the query is absent, placement falls back to `coa_time`,
  # and the start of any waveform landing near a boundary is cropped.
  #
  # 0.16.0 adds the other half, `post_coalescence_duration`. Without the tail, a run whose
  # start-time is later than its population's first event cannot tell that the earlier events are
  # finished, so it claims every one of them into its first segment and discards the samples; the
  # batch then grows with the distance from the catalogue start until the preflight refuses it.
  #
  # 0.16.0 also carries a projection *correctness* fix (gwmock-signal #370): the source direction is
  # projected into the frame of date, where before `gha = GMST - right_ascension` mixed a J2000 right
  # ascension with an Earth rotation measured from the mean equinox of date -- 0.43 degrees in right
  # ascension by 2030. It changes continuous-wave output, which is why the bump landed with
  # regenerated e2e references rather than inside this change.
  "gwmock-signal>=0.16.1",
  "gwmock-noise>=0.10.2",
  "gwmock-pop>=0.11.6",
  "typer>=0.19.0",         # Literal-type CLI options; the SPEC 0 floor (0.13) predates them
  "tqdm>=4.67.0",
  "h5py>=3.12.1",
  "pydantic>=2.9.0",
  "pymap3d>=3.2.0",
  "psutil>=6.1.0",
  "filelock>=3.16.0",
  "textual>=2.0.0",        # Content.from_markup; the SPEC 0 floor (0.73) predates it
]

[project.optional-dependencies]
sgwb = ["gwmock-signal[sgwb]>=0.16.1"]
# The batched signal path. Without this extra `SignalAdapter.simulate_segments` and
# `execution: batched` raise, because gwmock-signal's batched entry points need JAX and ripple,
# which the base install omits.
#
# **This is CPU JAX.** The wheels resolved here carry no GPU backend, so `execution: batched`
# installed this way batches the work and runs it on the CPU. That is a supported configuration --
# it is the one the test suite exercises -- but it is not device execution, and nothing at runtime
# distinguishes the two beyond `jax.devices()`. Use the `cuda` extra below for a GPU.
#
# Floored above 0.13.0 because 0.15.0 floors `ripplegw>=0.3.1`, the first ripple
# carrying the geocentre fix (GW-JAX-Team/ripple#141). Without it the continuous-wave path gets a
# ripple that returns NaN for every sample at the geocentre, where these simulators generate. The
# floor is deliberately *not* restated here as a `ripplegw` declaration: it belongs beside the
# guard that raises on those NaNs, which lives in gwmock-signal, and stating a version in two
# repositories is how the two drift.
jax = ["gwmock-signal[jax]>=0.16.1"]
# The same path with an actual GPU backend. Linux x86_64 with a CUDA 12 driver only; there is no
# macOS or Windows wheel, which is why this is separate from `jax` rather than folded into it.
cuda = ["gwmock-signal[jax]>=0.16.1", "jax[cuda12]>=0.11.0"]

[dependency-groups]
dev = [
  "prek>=0.4.13",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-github-actions-annotate-failures>=0.4.2",
]
docs = ["zensical>=0.0.53", "mkdocstrings-python>=2.0.5"]
build = ["hatch>=1.18.0"]
release = ["git-cliff>=2.13.1"]

[project.scripts]
gwmock = "gwmock.cli.main:app"

[project.urls]
Documentation = "https://leuven-gravity-institute.github.io/gwmock"
Source = "https://github.com/Leuven-Gravity-Institute/gwmock"
Tracker = "https://github.com/Leuven-Gravity-Institute/gwmock/issues"

[tool.dependency-support-policy]
policy = "spec0"
groups = ["project", "optional"]
# ecosystem siblings: Renovate keeps them at latest
exclude = ["gwmock-signal", "gwmock-noise", "gwmock-pop"]
lock = "minimal"

[tool.uv-dynamic-versioning]
vcs = "git"      # default
style = "semver" # or pep440, semver, etc.

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/gwmock"]

# Register the custom build hook
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",                # Include the source code
  "/examples/**/*.yaml", # Include only YAML files from examples
  "/tests",              # Include tests for source distributions
  "/README.md",
  "/pyproject.toml",
  "/hatch_build.py",     # Include the build hook itself
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 0

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
addopts = [
  "--cov=gwmock",
  "--cov-report=xml",
  "--cov-report=term",
  "--junitxml=test-results.xml",
  "--cov-append",
  "-m",
  "not integration and not e2e",
]
pythonpath = ["src"]
testpaths = "tests"
junit_family = "xunit2"
markers = [
  "integration: marks as integration test",
  "notebooks: marks as notebook test",
  "gpu: marks as gpu test",
  "spark: marks tests which need Spark",
  "slow: marks tests as slow",
  "unit: fast offline tests",
  # Drives an example configuration through the real CLI. Excluded from the default run via
  # `-m "not e2e"` below, because these generate data and are minutes rather than seconds; the
  # `e2e` CI job runs them, and it installs the extras the matrix needs so the optional-stack
  # entries in tests/e2e/matrix.py actually execute rather than silently skipping.
  "e2e: end-to-end tests that run an example config through the CLI",
]

[tool.ruff]
line-length = 120 # Matches Black's default
target-version = "py312" # Align with requires-python (>=3.12)
lint.select = [
  "E",
  "F",
  "W",   # pycodestyle errors and warnings
  "I",   # isort rules
  "UP",  # pyupgrade rules
  "C90", # McCabe complexity
  "N",   # PEP8 naming
  "B",   # Bugbear (opinionated checks)
  "A",   # Flake8-builtins
  "C4",  # Flake8-comprehensions
  "PT",  # Flake8-pytest
  "RUF", # Ruff-specific rules
  "PL",  # Add pylint rules for fuller coverage
  "SIM", # Similarities
  "T10", # Debugger statements
  "S",   # Security rules
]
lint.ignore = [
  "E501", # Line length (handled by formatter)
  "C901", # Disable overly strict complexity checks (optional, adjust as needed)
]
lint.pylint.max-args = 10
fix = true # Enable autofix
lint.unfixable = [] # List rules that should not be autofixed, if any
exclude = ["docs/conf.py"]

[tool.ruff.format]
quote-style = "double"       # Use double quotes for strings
indent-style = "space"       # Use spaces for indentation
docstring-code-format = true # Format code in docstrings

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules in the tests directory
"tests/*" = ["S101", "ARG001", "PLC0415", "PLR2004"]
# S101: allow assert statements
# ARG001: allow unused function arguments (common in fixtures)
# PLC0415: allow import statements not at the top level
# PLR2004: allow magic values in the unit tests

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
