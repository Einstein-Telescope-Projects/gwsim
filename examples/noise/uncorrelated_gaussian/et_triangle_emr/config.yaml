globals:
    simulator-arguments:
        sampling-frequency: 4096
        duration: 4096
        total-duration: 1 day
        start-time: 1577491218
    working-directory: .
    output-directory: output
    metadata-directory: metadata

orchestration:
    population:
        backend: FilePopulationLoader
        source-type: bbh
        n-samples: 128
        arguments:
            path: https://sandbox.zenodo.org/records/413548/files/18321_1yrCatalogBBH.h5
    signal:
        waveform-model: IMRPhenomXPHM
        waveform-arguments:
            reference_frequency: 50
        minimum-frequency: 20
        detectors:
            - ET-Triangle-EMR
        output:
            output_directory: signal
            file_name:
                'E-{{ detectors }}_STRAIN_BBH-{{ start_time }}-{{ duration
                }}.gwf'
            arguments:
                channel: '{{ detectors }}:STRAIN'
    noise:
        arguments:
            psd_file: ET_10_full_cryo_psd
            seed: 42
            detectors:
                - E1_triangle_emr
                - E2_triangle_emr
                - E3_triangle_emr
        output:
            output_directory: noise
            file_name: et-noise-{{ counter }}.gwf
            arguments:
                channel_prefix: STRAIN
